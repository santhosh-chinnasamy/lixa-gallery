[package]
name = "lixa-gallery"
version = "0.7.1"
description = "Select your favorite photos and export"
authors = ["santhosh-chinnasamy"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gallery-core = { path = "gallery-core" }
services = { path = "services" }
infra = { path = "infra" }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = { version = "1.0.98" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
futures = "0.3.31"
percent-encoding = "2.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"

[workspace]
members = [
    "gallery-core",
    "services",
    "infra",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
description = "Select your favorite photos and export"
authors = ["santhosh-chinnasamy"]
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.98"
serde = { version = "1", features = ["derive"] }
futures = "0.3.31"
log = "0.4"
thiserror = "2"
async-trait = "0.1"
async-recursion = "1.1.1"

[workspace.lints.clippy]
# async_trait expands methods to Pin<Box<dyn Future>>, which is already
# #[must_use], so Clippy's double_must_use fires on every async trait method.
double_must_use = "allow"

[lints]
workspace = true

[profile.dev]
debug = 0
