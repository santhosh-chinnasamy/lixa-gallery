name: Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Lint Commits (Conventional)
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR Commits
        uses: wagoid/commitlint-github-action@v6

  test-build:
    name: Test Build App (Linux)
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: install frontend dependencies (frozen lockfile)
        run: yarn install --immutable

      - name: verify frontend types
        run: yarn svelte-check

      - name: frontend unit tests
        run: node --test scripts/*.test.mjs scripts/*.test.ts site/*.test.mjs

      - name: build frontend
        run: yarn build

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

      # Installer bundling stays on pull requests into main. Release
      # workflows are unchanged and still run only from main.
      - name: build app
        if: ${{ github.base_ref == 'main' }}
        run: yarn tauri build
