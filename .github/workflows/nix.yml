name: 'Nix Cache'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'lixa-gallery-v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= lixa-gallery.cachix.org-1:cy41vSEjVo4t1+nLSz4B8/Rd261rKvo0vp8BBwC692w=

      - uses: cachix/cachix-action@v15
        with:
          name: lixa-gallery
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Nix package
        run: nix build -L .#default
